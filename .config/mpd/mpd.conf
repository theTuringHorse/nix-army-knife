# Run as user service: systemctl --user enable --now mpd.service
music_directory     "~/share/Music"
playlist_directory  "~/.local/state/mpd/playlists"
db_file             "~/.local/state/mpd/database"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/state/mpd/sticker.sql"

bind_to_address     "127.0.0.1"
port                "6600"

auto_update         "yes"
restore_paused      "yes"

audio_output {
    type    "pipewire"
    name    "PipeWire"
}

# Feeds ncmpcpp's visualizer
audio_output {
    type    "fifo"
    name    "Visualizer"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}
